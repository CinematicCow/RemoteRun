name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The Rust gate doesn't need the real dashboard; embed the placeholder so CI
  # doesn't have to install bun.
  RR_SKIP_DASHBOARD_BUILD: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt-check
      - name: Clippy
        run: cargo lint
      - name: Tests
        run: cargo test-all
