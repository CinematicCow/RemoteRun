name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.1.0"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    env:
      RR_SKIP_DASHBOARD_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check version matches Cargo.toml
        shell: bash
        run: |
          version="${{ inputs.version }}"
          if ! grep -q "^version = \"$version\"$" Cargo.toml; then
            echo "input $version does not match Cargo.toml" >&2
            exit 1
          fi
      - name: Check tag does not exist
        shell: bash
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ inputs.version }}" | grep -q .; then
            echo "tag v${{ inputs.version }} already exists" >&2
            exit 1
          fi
      - name: Formatting
        run: cargo fmt-check
      - name: Clippy
        run: cargo lint
      - name: Tests
        run: cargo test-all

  build:
    name: Build Linux binary
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked
      - name: Check binary version
        shell: bash
        run: |
          ./target/release/rr --version | grep -q "${{ inputs.version }}"
      - name: Stage package
        shell: bash
        run: |
          version="${{ inputs.version }}"
          staging="rr-$version-x86_64-unknown-linux-gnu"
          mkdir -p "$staging"
          cp target/release/rr "$staging/"
          cp LICENSE "$staging/"
          if [ -f CHANGELOG.md ]; then
            cp CHANGELOG.md "$staging/"
          fi
          tar czf "$staging.tar.gz" "$staging"
          sha256sum "$staging.tar.gz" > "$staging.tar.gz.sha256"
          echo "ARCHIVE=$staging.tar.gz" >> "$GITHUB_ENV"
          echo "SUM=$staging.tar.gz.sha256" >> "$GITHUB_ENV"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-archive
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.SUM }}
          if-no-files-found: error

  draft:
    name: Draft release
    needs: [build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: release-archive
      - name: Build release notes
        shell: bash
        run: |
          version="${{ inputs.version }}"
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$version" '
              $0 ~ "^## \\[" ver "\\]" { found=1; print; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > notes.md
            if [ ! -s notes.md ]; then
              echo "Release v$version" > notes.md
            fi
          else
            echo "Release v$version" > notes.md
          fi
          cat notes.md
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version="${{ inputs.version }}"
          gh release create "v$version" \
            --draft \
            --title "v$version" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            rr-"$version"-x86_64-unknown-linux-gnu.tar.gz \
            rr-"$version"-x86_64-unknown-linux-gnu.tar.gz.sha256
