[package]
name = "rr"
version = "0.1.0"
edition = "2024"

rust-version = "1.85"

[dependencies]
axum = { version = "0.8", features = ["json"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
nix = { version = "0.30", features = ["signal"] }
mime_guess = "2"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "serde", "macros"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "net",
    "io-util",
    "signal",
    "time",
    "sync",
    "fs",
] }
tokio-stream = { version = "0.1", features = ["sync"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
