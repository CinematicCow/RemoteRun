[package]
name = "rr"
version = "0.1.0"
edition = "2024"

rust-version = "1.85"

[lints.rust]
unsafe_code = "deny"
unused = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
# Keep the broad groups visible without turning every style preference into a
# build failure. The focused denies below are the anti-slop gate.
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
panic = "deny"
redundant_clone = "deny"
needless_collect = "deny"
mem_forget = "deny"

[dependencies]
axum = { version = "0.8", features = ["json"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
nix = { version = "0.30", features = ["signal"] }
mime_guess = "2"
ratatui = "0.30"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "serde", "macros"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "net",
    "io-util",
    "signal",
    "time",
    "sync",
    "fs",
] }
tokio-stream = { version = "0.1", features = ["sync"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
